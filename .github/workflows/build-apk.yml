name: Build SA-MP Mobile APK (NoobCoder Client)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android NDK & SDK
        run: |
          echo "=== Accepting Android SDK Licenses ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "=== Installing Android SDK 34 & NDK 28 ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;28.0.13004108" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleVer_releaseRelease assembleVer_releaseDebug --no-daemon --stacktrace

      - name: Locate and Prepare Output APKs
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Mobile-NoobCoder-APKs
          path: output_apks/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SA-MP Mobile Client GTA SA 2.10 (Build #${{ github.run_number }})"
          body: |
            Automated Android APK build for SA-MP Mobile Client (GTA SA 2.10).
            - Based on: `noobcooder-sys/SA-MP-Mobile-Client-GTA-SA-2.10-`
            - Commit: `${{ github.sha }}`
            - Workflow Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
